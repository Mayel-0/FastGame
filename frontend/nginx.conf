server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers compilés : s'ils manquent, vraie erreur 404
    location /assets/ {
        try_files $uri =404;
    }

    # index.html ne doit pas rester en cache (sinon un déploiement n'apparaît pas)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Toutes les autres URL : on renvoie index.html, React Router décide
    location / {
        try_files $uri $uri/ /index.html;
    }
}
