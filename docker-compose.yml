services:
  db:
    image: postgres:17-alpine
    container_name: postgres_fastgames
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Utilise 5433 si 5432 est déjà utilisé par ton autre BDD (resume_db)
    volumes:
      - fastgames_db_data:/var/lib/postgresql/data

  # 2. Backend FastAPI
  backend:
    build: ./FastGame/backend # Vérifie le chemin exact vers ton dossier backend
    container_name: fastgames_backend
    restart: always
    volumes:
      - ./FastGame/backend/media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./FastGame/backend/.env.production
    depends_on:
      - db

  # 3. Frontend React
  frontend:
    build: ./FastGame/frontend # Vérifie le chemin exact vers ton dossier frontend
    container_name: fastgames_frontend
    restart: always
    ports:
      - "8081:80"
    env_file:
      - ./FastGame/frontend/.env.production
    depends_on:
      - backend

volumes:
  fastgames_db_data:
